# Vale lints only the comments of a code file, and comment-lint passes it
# only the files that comments.json selects. One catch-all section is enough.
#
# The package is pinned. A releases/latest URL changes the rules, and every
# count, with no change here.

StylesPath = styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

[*]
BasedOnStyles = Comments, Slop
