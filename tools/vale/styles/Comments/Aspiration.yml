# Rule 18 and Sin 9, the Docs-to-Follow: a TODO in code is a tracked item
# that escaped tracking. A lowercase todo counts where it opens a line of
# the comment. Vale masks JSDoc tags, so no token can see an @todo.
extends: existence
message: "'%s' promises later work. File it where work is tracked."
link: https://github.com/indexzero/of-structure/blob/main/skills/elements-of-structure/references/rules.md#rule-18-sign-the-cliffs-skip-the-coastline-comments
level: warning
scope: comment
nonword: true
tokens:
  - '\bTODO\b(?!\.md)'
  - '\bFIXME\b'
  - '(?im)(?:^|//\s*|\*\s*)(?:todo|fixme)\b'
  - '(?i)\bfor now\b'
  - '(?i)\b(?:this|it) will be (?:added|fixed|implemented|removed)\b'
