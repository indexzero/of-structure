# Rule 18: locality is a claim. A line number in another file moves with
# every edit to that file, and nothing checks it.
extends: existence
message: "'%s' cites a line number. Name the symbol instead."
link: https://github.com/indexzero/of-structure/blob/main/skills/elements-of-structure/references/rules.md#rule-18-sign-the-cliffs-skip-the-coastline-comments
level: warning
scope: comment
nonword: true
raw:
  - '[\w@./-]+\.(?:[cm]?[jt]sx?|py|go|rs|rb|java|kt|swift|c|cc|cpp|h|md|json|ya?ml):\d+(?:-\d+)?'
