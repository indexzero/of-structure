# Sin 15, the Confident Essay: length worn as authority. Vale counts the
# words of each comment. A run of // lines is one comment, and so is a run
# of trailing comments that start in the same column.
extends: occurrence
message: "A comment of more than 60 words. Keep the cliff sign; move the rest to the document that owns it."
link: https://github.com/indexzero/of-structure/blob/main/skills/elements-of-structure/references/rules.md#the-fifteen-sins
level: warning
scope: comment
max: 60
token: '[^\s]*\w[^\s]*'
