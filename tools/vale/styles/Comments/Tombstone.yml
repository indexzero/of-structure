# Sin 4, the Tombstone: a comment that says what the code used to do. The
# past has a home already: git. Each token names the code, or a change to
# it, because "no longer exists", "was removed by discover()" and "the old
# version of a file" also describe state at run time.
extends: existence
message: "'%s' describes the past. History belongs to the log; keep only a trap the next reader could meet."
link: https://github.com/indexzero/of-structure/blob/main/skills/elements-of-structure/references/rules.md#rule-18-sign-the-cliffs-skip-the-coastline-comments
level: warning
scope: comment
ignorecase: true
tokens:
  - '(?:this|it|the code) used to'
  - '(?:this|it|the code) (?:previously|formerly)'
  - 'previously,? (?:this|it|the code)'
  - '(?:this|it|the code) no longer (?:uses|calls|needs|supports|does|has|reads|writes)'
  - '(?:this|it|the code|the function|the module) (?:was|were|has been) (?:replaced|changed|removed|renamed|rewritten)'
  - 'the old (?:code|implementation|behaviou?r|way|path) (?:of|in|here|did)'
  - 'before (?:#\d+|this change|the fix|the rewrite|the refactor)'
